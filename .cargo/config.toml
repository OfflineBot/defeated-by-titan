# Abkuerzungen, damit die Maschinenunterschiede aus docs/umgebung.md nicht jedes Mal
# von Hand getippt werden muessen. Welches Fenstersystem gelinkt wird, steht in Cargo.toml.
[alias]
# Maschine B (offlinebot, niri/Wayland): das Spiel starten, mit Ton
play = "run --features wayland,audio"
# Maschine A (debian, ohne Grafiksitzung): eine Skriptfahrt ohne Fenster
drive = "run -- --headless --script"
