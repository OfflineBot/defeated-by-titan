[package]
name = "defeated_by_titan"
version = "0.1.0"
edition = "2024"

# Bevy's umbrella features `3d`, `ui` and `2d` pull in `default_platform`, and that one has
# `wayland` and `bevy_gilrs` hard-wired inside it. Machine A (debian) has almost no
# development libraries and no passwordless sudo — what is there is openssl, libuv and
# libcrypt (`ls /usr/lib/x86_64-linux-gnu/pkgconfig/`). Measured [debian]:
#   with `default`               : breaks after  9m22s in `wayland-sys` (wayland-client.pc)
#   with the list, but `audio`   : breaks after 13m40s in `alsa-sys`    (alsa.pc)
# So the base list is assembled by hand and contains **nothing that needs a system library
# at build time**. Everything system-dependent stands below in [features].
#
# Deliberately not in it:
#   bevy_gilrs  — no gamepad. The bible fixes PC with keyboard and mouse as the ONLY input
#                 device (3.5); a gamepad stack needs libudev and would be compute time for
#                 something nobody ever uses.
[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "default_app",          # async_executor, bevy_asset, bevy_log, bevy_state
    "std",
    "multi_threaded",
    "3d_bevy_render",       # bevy_render, core_pipeline, pbr, gltf, anti_alias, gizmos
    "scene",                # .glb scenes
    "ui_api",
    "ui_bevy_render",       # the F3 overlay and later the HUD
    "default_font",         # without it text renders nothing and does not say so
    "picking",
    "sysinfo_plugin",
    # **Every texture in the model pack is a PNG.** `png` came in transitively until
    # 2026-08-18 (through `bevy_image`'s own default), which means a feature trim anywhere in
    # the tree would have taken the image decoder away and the 278 models would have rendered
    # untextured — Bevy does not fail on a format it cannot decode, it logs and carries on.
    # A dependency that all 278 files rely on is named here, not inherited.
    "png",
] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

# Physics. avian3d 0.7.0 demands exactly bevy 0.19.0 (avian3d-0.7.0/Cargo.toml,
# [dependencies.bevy] version = "0.19.0") — which fits the base list above.
#
# `default` pulls nine features. Four of them we do not need, and three of those cost build
# time for code nobody calls today:
#   collider-from-mesh — pulls bevy_mesh + bevy_mikktspace. The city comes out of maps.ron
#                        as cuboids; a collider out of a glTF mesh is a topic once titans
#                        have real models. Adding it later is one line.
#   bevy_scene         — pulls bevy_world_serialization, belongs to collider-from-mesh.
#   bevy_picking       — avian's picking backend (mouse hits collider). The crosshair asks
#                        through SpatialQuery, not through bevy_picking.
#
# Deliberately IN, although it costs build time:
#   xpbd_joints        — WITHOUT it there is no built-in joint solver
#                        (dynamics/joints/mod.rs:242: "For a built-in joint solver,
#                        enable the `xpbd_joints` feature"). The rope IS a joint.
#   debug-plugin       — needs bevy_gizmos + bevy_render, both already on above.
#                        Stage 🟧 demands a picture; without PhysicsDebugPlugin there is no
#                        picture of a collider.
#   parallel           — bevy/multi_threaded is already on above, plus parry3d/parallel.
#
# enhanced-determinism is NOT on. It switches libm on (dep:libm, bevy_math/libm,
# bevy_heavy/libm, parry3d/enhanced-determinism) and thereby replaces the hardware
# transcendentals with software implementations — identical across platforms, but slower.
# Switchable through `--features determinism`, see below.
avian3d = { version = "0.7.0", default-features = false, features = [
    "3d",
    "f32",
    "parry-f32",        # zieht `default-collider`: Collider, SpatialQuery, ShapeCaster
    "parallel",
    "xpbd_joints",
    "debug-plugin",
] }

[features]
# What the MACHINE can do is decided by the machine — not by the code (docs/environment.md).
#   Machine A (debian, headless)   : `cargo build`                        — the default
#   Machine A with no window at all: `cargo build --no-default-features`  — needs NOTHING
#   Machine B (offlinebot, niri)   : `cargo play`   = --features wayland,audio
#
# x11 is the default because winit uses `x11rb`/`x11-dl` for it and dlopens at run time: it
# needs no system library at build time. wayland needs `wayland-client.pc`, audio needs
# `alsa.pc` — neither of them exists on A.
default = ["x11"]
x11 = ["bevy/bevy_winit", "bevy/x11"]
wayland = ["bevy/bevy_winit", "bevy/wayland"]
# Windows. winit needs no display-server feature there — `bevy_winit` alone is the whole
# story, and `x11`/`wayland` are Linux-only and would fail to build. So a Windows build is
#     cargo run --no-default-features --features windows
# ⚠️ **UNTESTED, AND IT CANNOT BE TESTED HERE.** `cargo check --no-default-features --features
# windows` on Linux fails with **"The platform you're compiling for is not supported by winit"**
# — measured 2026-08-20. That error is **correct and expected**: winit needs a display-server
# feature on Linux and none on Windows. **Do not "fix" it by adding x11 back**, which would
# break the Windows build this feature exists for.
# There is no Windows machine in this project, and no `cfg(target_os)`, `cfg(unix)`, `/dev/` or
# `std::os::unix` anywhere in `src/` (checked 2026-08-20) — the game code is platform-blind.
# What is NOT proven: that the dependency tree builds, that `assets_dir()` finds `assets\` from
# a Windows working directory, and that wgpu picks a sane backend. See `docs/windows.md`.
windows = ["bevy/bevy_winit"]
# Without `wav` every .wav loads without an error and plays silence (prompts/init.md §3).
audio = ["bevy/audio", "bevy/wav"]
# Transcendentals identical across platforms (sin/cos/atan2 through libm instead of the
# FPU). A candidate for rollback netcode; until what it costs has been measured it stays a
# switch and not the default.
determinism = ["avian3d/enhanced-determinism"]

# Without this a debug build is UNPLAYABLE: Bevy itself does the batching, the transform
# propagation and the rendering. Our own crate stays cheap to compile, every dependency is
# built at full optimization. That is the difference between 20 and 200 fps
# (prompts/init.md §3).
[profile.dev]
opt-level = 1
# 🔴 DEBUG INFO IS WHY THE MACHINE SWAPPED, and it was never a decision — it is the `dev`
# default. Measured 2026-08-29 [offlinebot], while the user reported his editor stuttering:
# 10 GB in swap, under 1 GB free, the CPU 80 % IDLE, and `target/` at **91 GB**. Full debug
# info over every dependency built at `opt-level = 3` (below) is an enormous amount of data
# for the linker to hold and write, and nobody ever asked for it.
#
# `line-tables-only` keeps what this project actually uses debug info FOR — a file and a line
# in a panic message, which is what every `assert!` in `tests/` prints — and drops the type
# and variable descriptions a step debugger would want. Nothing in this repo runs a step
# debugger; the evidence is scripts, asserts and screenshots.
# ⚠️ `opt-level` is NOT touched: it is the difference between 20 and 200 fps and it is the
# reason this profile exists at all.
debug = "line-tables-only"
# Keeps the debug data out of the binary and out of the linker's working set.
split-debuginfo = "unpacked" 

[profile.dev.package."*"]
opt-level = 3
