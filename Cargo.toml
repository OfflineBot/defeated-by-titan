[package]
name = "defeated_by_titan"
version = "0.1.0"
edition = "2024"

# Bevys Sammelfeatures `3d`, `ui` und `2d` ziehen `default_platform` nach, und darin stecken
# `wayland` und `bevy_gilrs` fest verdrahtet. Auf Maschine A (debian) gibt es fast keine
# Entwicklungsbibliotheken und kein passwortloses sudo — vorhanden sind nur openssl, libuv
# und libcrypt (`ls /usr/lib/x86_64-linux-gnu/pkgconfig/`). Gemessen [debian]:
#   mit `default`                : bricht nach  9m22s in `wayland-sys` ab (wayland-client.pc)
#   mit Liste, aber `audio`      : bricht nach 13m40s in `alsa-sys`    ab (alsa.pc)
# Deshalb ist die Basisliste von Hand zusammengestellt und enthaelt **nichts, was eine
# Systembibliothek zur Bauzeit braucht**. Alles Systemabhaengige steht unten in [features].
#
# Nicht dabei und mit Absicht:
#   bevy_gilrs  — kein Gamepad. Die Bibel legt PC mit Tastatur und Maus als EINZIGES
#                 Eingabegeraet fest (3.5); ein Gamepad-Stack braucht libudev und waere
#                 Rechenzeit fuer etwas, das nie benutzt wird.
[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "default_app",          # async_executor, bevy_asset, bevy_log, bevy_state
    "std",
    "multi_threaded",
    "3d_bevy_render",       # bevy_render, core_pipeline, pbr, gltf, anti_alias, gizmos
    "scene",                # .glb-Szenen
    "ui_api",
    "ui_bevy_render",       # das F3-Overlay und spaeter das HUD
    "default_font",         # ohne das rendert Text nichts und meldet es nicht
    "picking",
    "sysinfo_plugin",
] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

# Physik. avian3d 0.7.0 verlangt exakt bevy 0.19.0 (avian3d-0.7.0/Cargo.toml,
# [dependencies.bevy] version = "0.19.0") — passt zur Basisliste oben.
#
# `default` zieht neun Features. Vier davon brauchen wir nicht und drei davon kosten
# Bauzeit fuer Code, den heute niemand aufruft:
#   collider-from-mesh — zieht bevy_mesh + bevy_mikktspace. Die Stadt kommt aus maps.ron
#                        als Quader; ein Collider aus einem glTF-Mesh ist erst ein Thema,
#                        wenn Titanen echte Modelle haben. Nachtragen ist eine Zeile.
#   bevy_scene         — zieht bevy_world_serialization, gehoert zu collider-from-mesh.
#   bevy_picking       — avians Picking-Backend (Maus trifft Collider). Das Fadenkreuz
#                        fragt ueber SpatialQuery, nicht ueber bevy_picking.
#
# Bewusst DRIN, obwohl es Bauzeit kostet:
#   xpbd_joints        — OHNE das gibt es keinen eingebauten Joint-Loeser
#                        (dynamics/joints/mod.rs:242: „For a built-in joint solver,
#                        enable the `xpbd_joints` feature"). Das Seil IST ein Joint.
#   debug-plugin       — braucht bevy_gizmos + bevy_render, beides ist oben schon an.
#                        Stufe 🟧 verlangt ein Bild; ohne PhysicsDebugPlugin gibt es
#                        kein Bild von einem Collider.
#   parallel           — bevy/multi_threaded ist oben schon an, dazu parry3d/parallel.
#
# enhanced-determinism ist NICHT an. Es schaltet libm ein (dep:libm, bevy_math/libm,
# bevy_heavy/libm, parry3d/enhanced-determinism) und ersetzt damit die
# Hardware-Transzendenten durch Softwareimplementierungen — plattformgleich, aber
# langsamer. Ueber `--features determinism` einschaltbar, siehe unten.
avian3d = { version = "0.7.0", default-features = false, features = [
    "3d",
    "f32",
    "parry-f32",        # zieht `default-collider`: Collider, SpatialQuery, ShapeCaster
    "parallel",
    "xpbd_joints",
    "debug-plugin",
] }

[features]
# Was die MASCHINE kann, entscheidet die Maschine — nicht der Code (docs/umgebung.md).
#   Maschine A (debian, headless)  : `cargo build`                  — Vorgabe
#   Maschine A ganz ohne Fenster   : `cargo build --no-default-features`  — braucht NICHTS
#   Maschine B (offlinebot, niri)  : `cargo play`   = --features wayland,audio
#
# x11 ist die Vorgabe, weil winit dafuer `x11rb`/`x11-dl` benutzt und zur Laufzeit dlopen't:
# es braucht keine Systembibliothek zur Bauzeit. wayland braucht `wayland-client.pc`,
# audio braucht `alsa.pc` — beides gibt es auf A nicht.
default = ["x11"]
x11 = ["bevy/bevy_winit", "bevy/x11"]
wayland = ["bevy/bevy_winit", "bevy/wayland"]
# Ohne `wav` laedt jede .wav fehlerfrei und spielt Stille (prompts/init.md §3).
audio = ["bevy/audio", "bevy/wav"]
# Plattformgleiche Transzendente (sin/cos/atan2 ueber libm statt ueber die FPU). Kandidat
# fuer Rollback-Netcode; bis gemessen ist, was es kostet, ist es ein Schalter und keine
# Vorgabe.
determinism = ["avian3d/enhanced-determinism"]

# Ohne das ist ein Debug-Build UNSPIELBAR: Bevy selbst macht das Batching, die
# Transform-Propagation und das Rendern. Der eigene Crate bleibt billig zu uebersetzen,
# jede Dependency wird auf voller Stufe gebaut. Das ist der Unterschied zwischen 20 und
# 200 fps (prompts/init.md §3).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
